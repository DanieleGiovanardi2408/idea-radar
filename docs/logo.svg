<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Idea Radar logo">
  <defs>
    <!-- Lo sweep: si dissolve dal bordo d'attacco (pieno) alla coda (nulla) -->
    <linearGradient id="sweep" x1="120" y1="40" x2="200" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2EE8A2" stop-opacity="0"/>
      <stop offset="1" stop-color="#2EE8A2" stop-opacity="0.32"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2EE8A2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2EE8A2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile scuro: il logo vive su qualunque sfondo, chiaro o scuro -->
  <rect x="4" y="4" width="248" height="248" rx="60" fill="#08121B"/>
  <rect x="4" y="4" width="248" height="248" rx="60" fill="none" stroke="#2EE8A2" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Anelli del quadrante -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#2EE8A2" stroke-opacity="0.28" stroke-width="2.5"/>
  <circle cx="128" cy="128" r="58" fill="none" stroke="#2EE8A2" stroke-opacity="0.20" stroke-width="2"/>
  <circle cx="128" cy="128" r="30" fill="none" stroke="#2EE8A2" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Croce d'assi, appena accennata -->
  <line x1="128" y1="34" x2="128" y2="222" stroke="#2EE8A2" stroke-opacity="0.10" stroke-width="2"/>
  <line x1="34" y1="128" x2="222" y2="128" stroke="#2EE8A2" stroke-opacity="0.10" stroke-width="2"/>

  <!-- Tacche cardinali sull'anello esterno -->
  <g stroke="#2EE8A2" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <line x1="128" y1="34" x2="128" y2="44"/>
    <line x1="128" y1="212" x2="128" y2="222"/>
    <line x1="34" y1="128" x2="44" y2="128"/>
    <line x1="212" y1="128" x2="222" y2="128"/>
  </g>

  <!-- Sweep: settore che precede il bordo d'attacco -->
  <path d="M128,128 L120.3,40.3 A88,88 0 0 1 200.1,77.5 Z" fill="url(#sweep)"/>
  <!-- Bordo d'attacco dello sweep -->
  <line x1="128" y1="128" x2="200.1" y2="77.5" stroke="#2EE8A2" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Il blip appena intercettato: vicino al centro, dove stanno le occasioni -->
  <circle cx="150" cy="106" r="17" fill="url(#glow)"/>
  <circle cx="150" cy="106" r="7" fill="#2EE8A2"/>

  <!-- Echi più deboli, più lontani dal centro -->
  <circle cx="70" cy="164" r="4.5" fill="#2EE8A2" fill-opacity="0.55"/>
  <circle cx="150" cy="196" r="3.5" fill="#2EE8A2" fill-opacity="0.30"/>

  <!-- Perno centrale -->
  <circle cx="128" cy="128" r="4" fill="#2EE8A2"/>
</svg>
