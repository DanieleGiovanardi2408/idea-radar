# Configurazione di Idea Radar
# Comportamento della pipeline: fonti, keyword, scoring, clustering.
# I segreti (token, host Ollama) stanno nel .env, non qui.

# Fonti da cui raccogliere idee/segnali (solo API gratuite).
sources:
  - name: hackernews
    type: hn
    limit: 30        # quante top-story scaricare
    enabled: true
  # Backfill HN via Algolia: colma i buchi a Mac spento con una finestra
  # fissa di 48h a ogni run e, ripassando sulle stesse storie per due giorni,
  # regala a item_stats osservazioni ripetute di engagement (il carburante
  # della heat "a delta"). Stessa source "hn" delle top-story:
  # i doppioni si fondono da soli per id.
  - name: hn-backfill
    type: hn_algolia
    limit: 30        # tetto di item per run, ordinati per punti
    enabled: true
    lookback_hours: 48
    min_points: 5    # sotto questi punti una storia è rumore
  - name: github
    type: github
    limit: 30        # quanti repo tenere, presi dal meglio di tutte le keyword
    enabled: true
    # Il vincolo che rende utile la fonte: si cercano repo NATI di recente,
    # ordinati per stelle. Senza, "ordinato per stelle" vuol dire freeCodeCamp e
    # tensorflow — i più famosi del mondo, cioè mercati chiusi. In 51 run la
    # vecchia query ha raccolto 31 repo sempre uguali, 22 creati prima del 2024.
    #
    # Le fasce d'età (bordi superiori, in giorni) si interrogano tutte, una
    # query per keyword per fascia, e la quota si divide tra loro: le stelle si
    # accumulano col tempo, quindi ordinare tutto insieme farebbe vincere sempre
    # la fascia più vecchia. La prima fascia si rinnova da sé man mano che
    # nascono progetti — è quella che tiene la fonte viva run dopo run.
    created_windows: [90, 270, 540]
    min_stars: 10    # sotto questa soglia è rumore
  # Riviste, blog e forum: il lato "trend" del radar.
  - name: riviste-e-forum
    type: rss
    limit: 120       # totale, ripartito tra i feed qui sotto (~5 a feed)
    enabled: true
    # Solo feed che servono RSS a un client semplice. I siti dietro muri
    # anti-bot Cloudflare o rate-limit aggressivo (es. r/selfhosted) sono
    # esclusi apposta: non vale la pena rincorrerli con trucchi sull'UA.
    # Un feed rotto non ferma gli altri e da oggi l'errore si vede nel Monitor,
    # sotto lo storico dei run: se uno non porta mai niente, toglilo di qui.
    feeds:
      # --- generalisti già collaudati ---
      - https://feeds.arstechnica.com/arstechnica/technology-lab
      - https://feed.infoq.com/
      - https://lobste.rs/rss
      - https://dev.to/feed
      - https://www.reddit.com/r/programming/.rss
      - https://github.blog/feed/
      - https://changelog.com/feed
      - https://simonwillison.net/atom/everything/
      # --- Hacker News per query: il segnale più denso, una riga a tema ---
      - https://hnrss.org/newest?q=self-hosted
      - https://hnrss.org/newest?q=ai+agents
      - https://hnrss.org/newest?q=developer+tools
      - https://hnrss.org/show                          # Show HN: lanci, non opinioni
      # --- dev.to per tag: stesso host, tagli diversi ---
      - https://dev.to/feed/tag/ai
      - https://dev.to/feed/tag/opensource
      - https://dev.to/feed/tag/devops
      # --- Lobsters per tag ---
      - https://lobste.rs/t/ai.rss
      - https://lobste.rs/t/programming.rss
      # --- blog di prodotto e ricerca: annunci prima che diventino notizia ---
      - https://huggingface.co/blog/feed.xml
      - https://blog.cloudflare.com/rss/
      - https://fly.io/blog/feed.xml
  # Paper freschi da arXiv: il lato "ricerca" del radar. API Atom gratuita,
  # senza chiave; una sola richiesta per run (categorie in OR in un'unica query).
  - name: arxiv
    type: arxiv
    limit: 25        # quanti paper più recenti
    enabled: true
    categories:      # categorie arXiv in OR; se vuote si usano le keywords globali
      - cs.AI
      - cs.MA        # sistemi multi-agente
      - cs.IR        # retrieval, RAG
      - cs.SE
  # Hugging Face Hub: modelli e dataset. API pubblica, senza chiave. Vale per un
  # motivo preciso: `likes` e `downloads` sono contatori VIVI, quindi qui la heat
  # si misura a delta come per GitHub e HN invece di essere stimata dall'età —
  # con arXiv e i feed RSS che non hanno engagement, era l'asse mancante.
  - name: huggingface
    type: huggingface
    limit: 30
    enabled: true
    hf_kinds: [models, datasets]   # la quota si divide tra i due
  # Stack Exchange: l'unica fonte che misura la DOMANDA e non l'offerta. Una
  # domanda votata e senza risposta accettata è un problema che la gente ha e
  # nessuno ha risolto. Gratuita e senza chiave fino a 300 richieste al giorno.
  - name: stackoverflow
    type: stackexchange
    limit: 25
    enabled: true
    site: stackoverflow
    max_age_days: 90     # oltre, non è più un segnale emergente
    # I tag vanno elencati a mano: le keyword sono frasi ("ai agents"), i tag di
    # SO sono token con trattini, e indovinare la conversione sbaglia spesso.
    tags:
      - langchain
      - large-language-model
      - ollama
      - rag
      - self-hosted
      - automation
  # npm: pacchetti nuovi, settimane prima che finiscano su HN. Senza chiave.
  # L'engagement sono i DOWNLOAD SETTIMANALI (api.npmjs.org, una richiesta per
  # pacchetto): i punteggi della search di npms.io sui dati reali sono 1.0 per
  # tutti, quindi inutili. I download sono un numero vero, sono già un tasso e
  # crescono: quarta fonte con la heat misurata a delta.
  - name: npm
    type: npm
    limit: 20
    enabled: true
    max_age_days: 45     # pubblicati di recente, altrimenti è react e lodash
  # Lanci di prodotto da Product Hunt (GraphQL v2, token developer gratuito).
  # richiede PRODUCTHUNT_TOKEN in .env: abilitala dopo averlo impostato.
  - name: producthunt
    type: producthunt
    limit: 25        # quanti lanci più recenti
    enabled: false

# Parole chiave per filtrare/cercare le idee e per il punteggio di "fit".
keywords:
  - "developer tools"
  - "automation"
  - "ai agents"
  - "open source"
  - "self-hosted"
  - "productivity"

# Parametri di scoring delle idee.
scoring:
  # Pesi delle metriche che si SOMMANO nella qualità (normalizzati a somma 1).
  # NB: `fit` e `opportunity` NON sono qui: sono moltiplicatori, non addendi.
  # Sono le due condizioni senza le quali un segnale non è un'opportunità, per
  # quanto sia popolare o ben fatto — e da addendi non fermavano niente.
  weights:
    heat: 0.30          # velocità di crescita (non popolarità assoluta)
    credibility: 0.15   # affidabilità della fonte/autore
    feasibility: 0.25   # quanto è realizzabile da un piccolo team (da LLM)
  # Quanto resta a un'idea del tutto fuori tema (fit=0): 0 = azzerata, 1 = fit ignorato.
  relevance_floor: 0.25
  # Come sopra ma per un mercato già chiuso (opportunity=0). Con opportunity al
  # 30% della media, n8n — saturazione piena, opportunity 0.00 — restava a 0.56 e
  # quarto in classifica: esattamente ciò che il README dice di non voler
  # mostrare. Come moltiplicatore scende a 0.12.
  opportunity_floor: 0.15
  # Soglia minima del composite perché un'idea passi a status "proposed".
  # RITARATA per la formula a due moltiplicatori: la scala si comprime (sul vero
  # archivio il massimo passa da 0.65 a 0.46), quindi questo valore non è
  # confrontabile col precedente 0.5. A 0.32 restano 28 idee sopra soglia su
  # 1359 — come le 27 di prima, ma senza i mercati chiusi.
  threshold: 0.32
  # Fit minimo perché a un item valga l'insight LLM: sotto, insight euristico
  # (niente 7B). 0.0 = salta solo gli item senza alcun match di keyword;
  # alzala (~0.2) per saltare anche i match deboli e velocizzare ancora i run.
  insight_min_fit: 0.0
  # Heat "a delta" (GitHub e HN, i contatori vivi): la velocità si misura tra
  # la più vecchia osservazione di item_stats in questa finestra (giorni) e la
  # più recente. Finestra piccola = heat reattiva, grande = più liscia; deve
  # coprire più run schedulati. Con meno di 2 osservazioni utili (item nuovo)
  # si ripiega sull'euristica engagement/età.
  heat_window_days: 3
  # Sotto questa distanza (ore) tra le due osservazioni il rapporto
  # engagement/tempo è rumore amplificato: si resta sull'euristica.
  heat_min_span_hours: 2

# Aggregazione semantica (richiede `ollama pull nomic-embed-text`).
clustering:
  # Similarità coseno minima perché un item entri nell'idea di un item già
  # visto. TARATA sui 1383 item in DB (26/07) contro una verità di riferimento
  # di 74 coppie di doppioni certi (stesso titolo su fonti diverse), la cui
  # similarità mediana è 0.951. Con nomic-embed-text la similarità di due item
  # PRESI A CASO è già 0.614 in media e il 99° percentile è 0.746: a 0.75
  # passavano 8006 coppie estranee (recall 96%), a 0.86 solo 111 (recall 92%).
  # Quattro punti di recall non valgono 72 volte i falsi positivi — sono la
  # benzina delle idee-calamita. Le bande, viste a campione: 0.75-0.82 estranei,
  # 0.82-0.86 stesso tema, 0.86+ stessa notizia. Da ri-tarare se si cambia
  # modello di embedding o il prefisso di task.
  idea_threshold: 0.86
  # Coesione: un item entra solo se somiglia a OGNI membro almeno così tanto.
  # Il legame singolo (soglia sopra) trova i doppioni; questo evita la catena
  # A~B~C con A e C estranei, cioè impedisce a un gruppo di crescere
  # diventando eterogeneo. Sui dati reali porta il gruppo più grosso da 9 a 6
  # item senza spezzare nessuna fusione legittima. 0 = disattivata.
  cohesion_floor: 0.82
  # Similarità minima (più permissiva) per mettere due idee nello stesso topic.
  # Il vecchio 0.70 veniva da uno sweep fatto sulle idee prodotte dal clustering
  # rotto, ed era sotto il 95° percentile delle coppie casuali (0.704): da lì i
  # topic-minestrone da 50 idee. Ri-sweepato sulle 1263 idee ricostruite (26/07):
  # a 0.70 il topic più grosso metteva insieme 61 idee senza un tema comune, a
  # 0.74 ne restavano 20 ancora scollegate, a 0.78 il gruppo più grosso (14) è
  # leggibile — la critica all'hype dell'AI. Sopra, si sbriciola in singleton.
  topic_threshold: 0.78
  # Nomina i topic con l'LLM invece di ereditare il titolo della prima idea.
  llm_topic_labels: true
  # Idee minime perché un topic valga una chiamata al 7B per il nome. Con le
  # soglie tarate i topic sono ~900 invece di 52, e rinominarli tutti a ogni run
  # sarebbe un'ora di modello: si nominano solo quelli la cui composizione è
  # cambiata dall'ultima fotografia, e solo se hanno almeno queste idee. Un topic
  # da una o due idee non ha niente da sintetizzare — il titolo dell'idea che lo
  # apre è già l'etichetta migliore. A 3: 74 topic su 893, il 92% in meno.
  topic_label_min_ideas: 3

# Run automatici: `idea-radar schedule install` registra un LaunchAgent che
# lancia `idea-radar run --scheduled` al login e ogni mezz'ora. Il run vero
# parte solo se passa le guardie qui sotto: gli altri tick sono "salti" da
# ~1 secondo, annotati (col motivo) nel log data/logs/scheduled.log.
scheduling:
  # Età minima (ore) dell'ultimo run completato perché un run schedulato
  # lavori: è la cadenza EFFETTIVA dei run automatici a Mac sveglio.
  # Si cambia qui, senza reinstallare il LaunchAgent.
  min_interval_hours: 4
  # true = se Ollama è spento o mancano i modelli, il run schedulato salta e
  # ritenta al tick successivo, invece di girare degradato (un run degradato
  # crea idee-singleton che non si ri-aggregano mai più). I run manuali NON
  # sono toccati da questa policy.
  require_ollama: true

# Ciclo di vita delle idee: l'archivio tiene il Radar fresco.
lifecycle:
  # Giorni senza segnali nuovi dopo i quali un'idea si archivia (in coda a
  # ogni run). 0 = disattivato. Un'idea archiviata sparisce da Radar e Topic
  # ma resta interrogabile (status=archived) e torna in vita da sola se un
  # item nuovo le appartiene.
  archive_after_days: 14
