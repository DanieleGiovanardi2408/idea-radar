[project]
name = "idea-radar-backend"
version = "0.1.0"
description = "Idea Radar backend — API e CLI per raccolta e scoring di idee"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.24",
    "httpx>=0.28",
    "pydantic-settings>=2.8",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
idea-radar = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
